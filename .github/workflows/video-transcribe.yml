name: video-transcribe
# Downloads a social video (Facebook, YouTube, TikTok, Instagram...) from the URL in tools/transcribe_queue.txt, transcribes it with Whisper and commits the transcript to tools/transcripts/.
on:
  push:
    paths: ['tools/transcribe_queue.txt']
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL'
        required: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install tools
        run: pip install -U yt-dlp faster-whisper youtube-transcript-api
      - name: Download and transcribe
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          mkdir -p work tools/transcripts
          if [ -n "$INPUT_URL" ]; then echo "$INPUT_URL" > work/urls.txt; else cp tools/transcribe_queue.txt work/urls.txt; fi
          cat > work/tr.py <<'PY'
          import sys, json
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = m.transcribe(sys.argv[1], vad_filter=True)
          out = [f"[{s.start:6.1f}-{s.end:6.1f}] {s.text.strip()}" for s in segs]
          open(sys.argv[2], "w").write("\n".join(out) + "\n")
          PY
          n=0
          while read -r URL; do
            URL="$(echo "$URL" | tr -d '\r' | xargs)"; [ -z "$URL" ] && continue
            n=$((n+1)); NAME="$(echo "$URL" | sed 's/[^A-Za-z0-9]/_/g' | tail -c 40)"
            rm -f work/video.*
            case "$URL" in *youtube.com*|*youtu.be*) python tools/yt_text.py "$URL" "tools/transcripts/$NAME.txt"; if ! grep -q FAILED "tools/transcripts/$NAME.txt"; then continue; fi;; esac
            yt-dlp -f "bv*[height<=720]+ba/b" --no-playlist -o "work/video.%(ext)s" "$URL" || yt-dlp --no-playlist -o "work/video.%(ext)s" "$URL" || { echo "DOWNLOAD FAILED $URL" > "tools/transcripts/$NAME.txt"; continue; }
            ffmpeg -y -i work/video.* -vn -ac 1 -ar 16000 work/a.wav
            mkdir -p tools/frames
            ffmpeg -y -i work/video.* -t 75 -vf "fps=1/2.5,scale=240:-1,tile=6x5" -frames:v 1 -q:v 4 "tools/frames/$NAME.jpg" || true
            python work/tr.py work/a.wav "tools/transcripts/$NAME.txt"
            echo "$URL" | cat - "tools/transcripts/$NAME.txt" > work/t.tmp && mv work/t.tmp "tools/transcripts/$NAME.txt"
            cp "tools/transcripts/$NAME.txt" tools/transcripts/latest.txt
          done < work/urls.txt
      - name: Commit transcript
        run: |
          git config user.name "transcriber"; git config user.email "transcriber@users.noreply.github.com"
          git add tools/transcripts tools/frames
          git commit -m "transcript" || echo nothing
          git pull --rebase -q || true
          git push || true
