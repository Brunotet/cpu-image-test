name: YouTube study
on:
  workflow_dispatch:
    inputs:
      ids:
        description: comma separated YouTube video ids
        required: true
        type: string
      label:
        required: true
        type: string
      model:
        required: false
        default: medium
        type: string
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      IDS: ${{ inputs.ids }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -U yt-dlp faster-whisper youtube-transcript-api
      - name: Optional cookies
        run: |
          if [ -n "$YT_COOKIES" ]; then printf "%s" "$YT_COOKIES" > cookies.txt; fi
      - name: Download, transcribe and read metadata
        run: python tools/yt_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-study-${{ inputs.label }}
          path: ytout/
          retention-days: 7
