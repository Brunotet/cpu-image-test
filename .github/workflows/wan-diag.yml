name: Wan weights kernel diag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Inspect
        run: |
          mkdir -p kaggle-wan
          { kaggle kernels status simoncreaty/wan-weights 2>&1;
            kaggle kernels list --mine -s wan-weights 2>&1 | head -5;
            kaggle kernels output simoncreaty/wan-weights -p wout --file-pattern '.*\.log' 2>&1 | tail -5;
            ls -la wout 2>&1; } > kaggle-wan/diag.txt
          cp wout/*.log kaggle-wan/weights.log 2>/dev/null || true
          git config user.name github-actions; git config user.email a@b.c
          git add kaggle-wan; git commit -m "wan weights diag" || true
          git pull --rebase -q; git push || true
