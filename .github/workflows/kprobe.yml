name: Kaggle Auth Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install kaggle
      - name: Auth check
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle --version
          echo "token length: ${#KAGGLE_API_TOKEN}"
          kaggle config view || true
          kaggle kernels list --mine -v | head -5 || true
          kaggle datasets list --mine -v | head -3 || true
