name: competitor-scout
# Reads the competitor channels listed in tools/competitor_channels.txt (title, views, upload date of their Shorts) and commits tools/competitor/<handle>.json.
# The n8n workflow reads it from raw.githubusercontent.com because YouTube blocks the n8n host.
on:
  push:
    paths: ['tools/competitor_channels.txt']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -U yt-dlp
      - name: Scrape channels
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          mkdir -p tools/competitor
          while read -r H; do
            H="$(echo "$H" | tr -d '\r' | xargs)"; [ -z "$H" ] && continue
            N="${H#@}"
            for TAB in shorts videos; do
              yt-dlp --flat-playlist --playlist-end 60 -J "https://www.youtube.com/$H/$TAB" > "work_$TAB.json" 2>err_$TAB.txt || echo "{}" > "work_$TAB.json"
            done
            python - "$N" <<'PY'
          import json, sys
          n = sys.argv[1]
          out = []
          seen = set()
          for tab in ('shorts', 'videos'):
              try:
                  d = json.load(open(f'work_{tab}.json'))
              except Exception:
                  d = {}
              for e in (d.get('entries') or []):
                  if not e or e.get('id') in seen: continue
                  seen.add(e.get('id'))
                  out.append({'id': e.get('id'), 'title': e.get('title'), 'views': e.get('view_count'), 'description': (e.get('description') or '')[:300], 'duration': e.get('duration'), 'tab': tab})
          out.sort(key=lambda x: -(x['views'] or 0))
          import os, urllib.request, urllib.parse
          key = os.environ.get('YT_API_KEY')
          if key:
              try:
                  def api(path, **q):
                      q['key'] = key
                      return json.load(urllib.request.urlopen('https://www.googleapis.com/youtube/v3/' + path + '?' + urllib.parse.urlencode(q), timeout=30))
                  ch = api('channels', part='contentDetails', forHandle=n)['items'][0]['contentDetails']['relatedPlaylists']['uploads']
                  ids, tok = [], None
                  for _ in range(4):
                      r = api('playlistItems', part='contentDetails', playlistId=ch, maxResults=50, **({'pageToken': tok} if tok else {}))
                      ids += [i['contentDetails']['videoId'] for i in r['items']]
                      tok = r.get('nextPageToken')
                      if not tok: break
                  api_out = []
                  for k in range(0, len(ids), 50):
                      for v in api('videos', part='snippet,statistics,contentDetails', id=','.join(ids[k:k+50]))['items']:
                          api_out.append({'id': v['id'], 'title': v['snippet']['title'], 'views': int(v['statistics'].get('viewCount', 0)), 'description': v['snippet'].get('description', '')[:300], 'duration': v['contentDetails']['duration'], 'tab': 'api'})
                  if api_out:
                      out = sorted(api_out, key=lambda x: -x['views']); print('YouTube API ok', len(out))
              except Exception as ex:
                  print('API failed, using yt-dlp data:', ex)
          json.dump({'channel': n, 'count': len(out), 'videos': out}, open(f'tools/competitor/{n}.json', 'w'), indent=1)
          print(n, len(out))
          PY
          done < tools/competitor_channels.txt
          cat err_shorts.txt | tail -5 || true
      - name: Commit
        run: |
          git config user.name "scout"; git config user.email "scout@users.noreply.github.com"
          git add tools/competitor
          git commit -m "competitor scan" || echo nothing
          git pull --rebase -q || true
          git push || true
