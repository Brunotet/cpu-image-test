name: Repair test
on:
  workflow_dispatch:
    inputs:
      path:
        required: true
        type: string
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      P: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          mkdir -p repairtest
          cp "$P" repairtest/in.mp3
          python3 tools/repair.py repairtest/in.mp3 > repairtest/log.txt 2>&1 || true
          mv repairtest/in.mp3 repairtest/repaired.mp3
          cat repairtest/log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "a@b.c"
          git add -A repairtest
          git commit -m "repair test" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 5; done
