name: Wake clip-engine worker (Kaggle)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-worker
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_MUSIC }}
      CFG_KEY: ${{ secrets.CLIP_WORKER_API_KEY }}
      CFG_HOOK: ${{ secrets.CLIP_N8N_TUNNEL_WEBHOOK }}
      CFG_COOKIE: ${{ secrets.CLIP_YT_COOKIE }}
    steps:
      - run: pip install -q kaggle
      - name: Re-run the worker notebook with its config
        run: |
          mkdir k
          kaggle kernels pull brunotet/clip-engine-worker -p k -m
          python3 - <<'PY'
          import os, json, glob
          cfg = {"WORKER_API_KEY": os.environ["CFG_KEY"], "N8N_TUNNEL_WEBHOOK": os.environ["CFG_HOOK"], "Cookie": os.environ.get("CFG_COOKIE", "")}
          for k, v in cfg.items():
              if k != "Cookie" and not v:
                  raise SystemExit("missing GitHub secret for " + k)
          f = glob.glob("k/*.py")[0]
          out = []
          for line in open(f).read().split(chr(10)):
              out.append("CFG = " + json.dumps(cfg) if line.startswith("CFG = ") else line)
          open(f, "w").write(chr(10).join(out))
          PY
          kaggle kernels push -p k
          kaggle kernels status brunotet/clip-engine-worker
