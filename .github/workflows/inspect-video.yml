name: inspect-video
# Downloads a finished video URL and commits contact sheets (frames) to tools/previews so they can be reviewed.
on:
  workflow_dispatch:
    inputs:
      url: { description: 'video url', required: true }
      name: { description: 'output name', required: true, default: 'check' }
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tools/previews w
          curl -sSL -o w/v.mp4 "${{ inputs.url }}"
          ffmpeg -y -loglevel error -i w/v.mp4 -vf "fps=1/2.2,scale=200:-1,tile=8x6" -q:v 4 "tools/previews/${{ inputs.name }}_%02d.jpg"
          git config user.name insp; git config user.email insp@users.noreply.github.com
          git add tools/previews; git commit -m "preview ${{ inputs.name }}" || true
          git pull --rebase -q || true; git push || true
