name: Episode images (Kaggle 2xT4)
on:
  workflow_dispatch:
    inputs:
      episode_id:
        required: true
        type: string
      shots_b64:
        description: "base64 JSON list: [{n,who,p,w,h}]"
        required: true
        type: string
      callback_url:
        required: false
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: kaggle-episode
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EP: ${{ inputs.episode_id }}
      SHOTS_B64: ${{ inputs.shots_b64 }}
      CALLBACK_URL: ${{ inputs.callback_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Write kernel
        run: |
          mkdir k
          cat > k/kernel-metadata.json <<'JSON'
          {"id":"simoncreaty/episode-images","title":"episode images","code_file":"kernel.py","language":"python","kernel_type":"script","is_private":true,"enable_gpu":true,"enable_internet":false,"dataset_sources":["simoncreaty/sdcpp-cache","simoncreaty/chars"]}
          JSON
          cat > k/kernel.tpl <<'PY'
          import os, subprocess, time, glob, shutil, threading, queue, json, base64
          from PIL import Image
          SHOTS = json.loads(base64.b64decode('__SHOTS_B64__').decode())
          src = os.path.dirname(glob.glob('/kaggle/input/**/sd-cli', recursive=True)[0])
          csrc = os.path.dirname(glob.glob('/kaggle/input/**/charB.jpg', recursive=True)[0])
          W = '/kaggle/working'
          shutil.copy(src+'/sd-cli', W+'/sd-cli'); os.chmod(W+'/sd-cli', 0o755)
          os.makedirs(W+'/out', exist_ok=True)
          env0 = dict(os.environ, LD_LIBRARY_PATH='/usr/local/cuda/lib64:'+os.environ.get('LD_LIBRARY_PATH',''))
          D, V, L = src+'/diff.gguf', src+'/vae.safetensors', src+'/llm.gguf'
          START = time.time()
          LIMIT = 420 + 40 * len(SHOTS)
          def watchdog():
              while True:
                  time.sleep(5)
                  if time.time() - START > LIMIT:
                      print('WATCHDOG: exceeded %d s, aborting to protect the GPU quota' % LIMIT, flush=True)
                      os._exit(2)
          threading.Thread(target=watchdog, daemon=True).start()
          subprocess.run('nvidia-smi -L', shell=True)
          for f_ in (D, V, L):
              t_ = time.time(); n_ = 0
              with open(f_, 'rb') as fh:
                  while True:
                      b_ = fh.read(64 << 20)
                      if not b_: break
                      n_ += len(b_)
              print('READ %s %.2f GB in %.1f s' % (os.path.basename(f_), n_ / 1e9, time.time() - t_), flush=True)
          if time.time() - START > 240:
              print('ABORT: model files read too slowly (%.0f s)' % (time.time() - START), flush=True)
              os._exit(3)
          ST = 'semi-realistic illustration, soft cinematic lighting, rich detail'
          CH = {
            'A': ('woman', 'young Black woman scientist', 'same mustard cardigan, round gold-rimmed glasses and dark green trousers'),
            'B': ('man', 'middle-aged East Asian man', 'same navy bomber jacket, gray hoodie, black rectangular glasses and beige chinos'),
            'C': ('man', 'young South Asian man with a short beard', 'same olive green jacket, white t-shirt and dark jeans'),
            'D': ('woman', 'elderly professor', 'same silver hair bun, teal blazer and cream blouse'),
          }
          def build(s):
              who = s.get('who', '') or ''
              p = s['p']
              if not who:
                  return '%s, %s' % (p, ST), []
              if len(who) == 1:
                  g, d, o = CH[who]
                  return 'The same %s from the reference image, %s, %s, %s' % (g, p, o, ST), [csrc+'/char%s.jpg' % who]
              refs = [csrc+'/char%s.jpg' % c for c in who]
              return 'The characters from the reference images together, %s, each keeps exactly their face and outfit from their reference, %s' % (p, ST), refs
          Q = queue.Queue()
          for s in SHOTS: Q.put(s)
          def worker(gpu):
              while True:
                  try: s = Q.get_nowait()
                  except queue.Empty: return
                  prompt, refs = build(s)
                  prompt = prompt.replace('"', "'")
                  r = ' '.join('-r "%s"' % x for x in refs)
                  w, h = int(s.get('w', 576)), int(s.get('h', 1024))
                  name = '%02d' % int(s['n'])
                  t = time.time()
                  cmd = '%s/sd-cli --diffusion-model "%s" --vae "%s" --llm "%s" %s -p "%s" --cfg-scale 1.0 --steps 4 --sampling-method euler -H %d -W %d -o %s/out/%s.png 2>&1 | grep -i -E "cuda|backend|vram|sampling|decode|total|error" | tail -n 8' % (W, D, V, L, r, prompt, h, w, W, name)
                  subprocess.run(cmd, shell=True, env=dict(env0, CUDA_VISIBLE_DEVICES=str(gpu)))
                  print('RENDER', name, 'gpu', gpu, int(time.time()-t), 's', flush=True)
          T0 = time.time()
          ts = [threading.Thread(target=worker, args=(g,)) for g in (0, 1)]
          [t.start() for t in ts]; [t.join() for t in ts]
          print('TOTAL', int(time.time()-T0), 's', flush=True)
          for f in glob.glob(W+'/out/*.png'):
              Image.open(f).convert('RGB').save(f[:-4]+'.jpg', quality=90); os.remove(f)
          os.remove(W+'/sd-cli')
          subprocess.run('ls -la %s/out' % W, shell=True)
          PY
          python3 - <<'PY'
          import os
          t = open('k/kernel.tpl').read().replace('__SHOTS_B64__', os.environ['SHOTS_B64'])
          open('k/kernel.py','w').write(t)
          PY
          rm k/kernel.tpl
      - name: Run kernel
        run: |
          kaggle kernels push -p k
          for i in $(seq 1 100); do
            s=$(kaggle kernels status simoncreaty/episode-images 2>&1 | tail -1); echo "$s"
            case "$s" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
            sleep 20
          done
          mkdir -p kout && kaggle kernels output simoncreaty/episode-images -p kout || true
          find kout -type f | head -50
      - name: Commit images
        run: |
          mkdir -p "episodes/$EP"
          find kout -name '*.jpg' -exec cp {} "episodes/$EP/" \;
          N=$(ls "episodes/$EP"/*.jpg 2>/dev/null | wc -l); echo "images: $N"
          echo "$N" > /tmp/n
          # keep only the 25 newest episodes
          ls -1dt episodes/*/ | tail -n +26 | xargs -r rm -rf
          git config user.name "github-actions"; git config user.email "a@b.c"
          git add -A episodes
          git commit -m "episode $EP images" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 5; done
      - name: Callback to n8n
        if: always() && env.CALLBACK_URL != ''
        run: |
          N=$(cat /tmp/n 2>/dev/null || echo 0)
          if [ "$N" -gt 0 ]; then S=ok; else S=error; fi
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"status\":\"$S\",\"episode_id\":\"$EP\",\"count\":$N,\"base_url\":\"https://raw.githubusercontent.com/Brunotet/cpu-image-test/main/episodes/$EP\"}" \
            "$CALLBACK_URL" -w '\nHTTP %{http_code}\n'
