name: Episode images (Kaggle T4, Qwen)
on:
  workflow_dispatch:
    inputs:
      episode_id:
        required: true
        type: string
      shots_b64:
        description: "base64 JSON list: [{n,who,p,w,h}]"
        required: true
        type: string
      callback_url:
        required: false
        default: ""
        type: string
permissions:
  contents: write
concurrency:
  group: kaggle-episode
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EP: ${{ inputs.episode_id }}
      SHOTS_B64: ${{ inputs.shots_b64 }}
      CALLBACK_URL: ${{ inputs.callback_url }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Build kernel from the Qwen notebook
        run: |
          mkdir -p k
          kaggle kernels pull simoncreaty/episode-images-qwen -p k -m
          python3 - <<'PY'
          import os, json
          meta = json.load(open("k/kernel-metadata.json"))
          code = os.path.join("k", meta["code_file"])
          lines = open(code).read().split(chr(10))
          idx = [i for i, l in enumerate(lines) if l.startswith("SHOTS = json.loads(")]
          assert len(idx) == 1, "expected exactly one SHOTS line, found %d" % len(idx)
          q = chr(34)
          lines[idx[0]] = "SHOTS = json.loads(__import__(" + q + "base64" + q + ").b64decode(" + q + os.environ["SHOTS_B64"] + q + ").decode())"
          open(code, "w").write(chr(10).join(lines))
          print("kernel", meta["id"], "file", meta["code_file"], "shots replaced")
          PY
      - name: Run kernel
        run: |
          kaggle kernels push -p k
          N=$(echo "$SHOTS_B64" | base64 -d | jq length)
          echo "expecting $N images"
          for i in $(seq 1 120); do
            s=$(kaggle kernels status simoncreaty/episode-images-qwen 2>&1 | tail -1); echo "$s"
            case "$s" in
              *COMPLETE*|*ERROR*|*CANCEL*) break;;
            esac
            sleep 20
          done
          for t in 1 2 3 4 5 6; do
            rm -rf kout; mkdir -p kout
            kaggle kernels output simoncreaty/episode-images-qwen -p kout 2>&1 | tail -n 3 || true
            got=$(find kout -name "*.jpg" | wc -l); echo "attempt $t: $got of $N images"
            [ "$got" -ge "$N" ] && break
            sleep 30
          done
          find kout -type f | head -60
      - name: Commit images
        run: |
          mkdir -p "episodes/$EP"
          find kout -name "*.jpg" -exec cp -t "episodes/$EP/" {} +
          cp kout/*.log "episodes/$EP/kernel.log" 2>/dev/null || true
          N=$(ls "episodes/$EP"/*.jpg 2>/dev/null | wc -l); echo "images: $N"
          echo "$N" > /tmp/n
          ls -1dt episodes/*/ | tail -n +26 | xargs -r rm -rf
          git config user.name "github-actions"
          git config user.email "a@b.c"
          git add -A episodes
          git commit -m "episode $EP images" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 5; done
      - name: Callback to n8n
        if: always() && env.CALLBACK_URL != ''
        run: |
          N=$(cat /tmp/n 2>/dev/null || echo 0)
          if [ "$N" -gt 0 ]; then S=ok; else S=error; fi
          B="https://raw.githubusercontent.com/Brunotet/cpu-image-test/main/episodes/$EP"
          jq -nc --arg s "$S" --arg ep "$EP" --argjson n "$N" --arg b "$B" '{status:$s,episode_id:$ep,count:$n,base_url:$b}' | curl -s -X POST -H "Content-Type: application/json" -d @- "$CALLBACK_URL" -w "HTTP %{http_code}"
