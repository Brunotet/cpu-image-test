name: Clip worker (GitHub runner)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clip-worker-runner
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKER_API_KEY: ${{ secrets.CLIP_WORKER_API_KEY }}
      N8N_HOOK: ${{ secrets.CLIP_N8N_TUNNEL_WEBHOOK }}
      YT_COOKIES_RAW: ${{ secrets.CLIP_YT_COOKIE }}
      WHISPER_DEVICE: cpu
      WHISPER_MODEL: small
      JOBS_DIR: /tmp/jobs
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker
        run: |
          git clone --depth 1 https://github.com/Brunotet/clip-engine.git app-src
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q fastapi 'uvicorn[standard]' -U 'yt-dlp[default]' deno whisperx 'scenedetect[opencv-headless]' soundfile
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
      - name: Run worker until idle
        run: |
          python3 - <<'PY'
          import os, re, sys, json, time, subprocess, urllib.request
          from pathlib import Path
          raw = os.environ.get("YT_COOKIES_RAW", "").strip()
          if raw.lower().startswith("cookie:"):
              raw = raw[7:].strip()
          if raw and "\t" not in raw:
              lines = ["# Netscape HTTP Cookie File"]
              for part in raw.split(";"):
                  if "=" not in part:
                      continue
                  k, v = part.strip().split("=", 1)
                  lines.append("\t".join([".youtube.com", "TRUE", "/", "TRUE", "2147483647", k, v]))
              raw = "\n".join(lines)
          env = dict(os.environ, YT_COOKIES_TXT=raw)
          Path(env["JOBS_DIR"]).mkdir(parents=True, exist_ok=True)
          api = subprocess.Popen([sys.executable, "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"], cwd="app-src", env=env, stdout=open("api.log", "w"), stderr=subprocess.STDOUT)
          tun = subprocess.Popen(["./cloudflared", "tunnel", "--url", "http://localhost:8002", "--no-autoupdate"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          url = None
          for line in tun.stdout:
              m = re.search(r"https://[a-z0-9-]+\.trycloudflare\.com", line)
              if m:
                  url = m.group(0)
                  break
          print("WORKER URL:", url)
          time.sleep(3)
          req = urllib.request.Request(os.environ["N8N_HOOK"], data=json.dumps({"worker_url": url}).encode(), headers={"Content-Type": "application/json"})
          print("n8n notified:", urllib.request.urlopen(req, timeout=30).status)
          IDLE = 15 * 60
          while api.poll() is None:
              time.sleep(30)
              busy = any('"state": "running"' in p.read_text() for p in Path(os.environ["JOBS_DIR"]).rglob("status.json"))
              if not busy and time.time() - os.path.getmtime("api.log") > IDLE:
                  print("idle shutdown")
                  break
          api.terminate()
          tun.terminate()
          PY
